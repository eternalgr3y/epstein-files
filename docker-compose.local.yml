# Local development/testing - no SSL
version: '3.8'

services:
  app:
    build: .
    container_name: epstein-files-local
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=*
      - DATABASE_PATH=/app/database/epstein_files.db
    volumes:
      - ./database:/app/database:ro
      - ./frontend:/app/frontend:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats', timeout=5).read(1)"]
      interval: 30s
      timeout: 10s
      retries: 3

# Usage: docker compose -f docker-compose.local.yml up --build
