name: Production smoke

on:
  workflow_dispatch:
    inputs:
      deployed_ref:
        description: Exact commit SHA expected to supply production assets
        required: true
        type: string
  workflow_call:
    inputs:
      deployed_ref:
        description: Exact commit SHA expected to supply production assets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Verify production release assets and routes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject a non-SHA deployment reference
        env:
          DEPLOYED_REF: ${{ inputs.deployed_ref }}
        run: |
          if ! printf '%s' "$DEPLOYED_REF" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "deployed_ref must be the exact 40-character commit SHA that was deployed" >&2
            exit 1
          fi

      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deployed_ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"

      - name: Run the repository production smoke within its request budget
        env:
          MAX_REQUESTS: "8"
        run: |
          python production_smoke.py \
            --site https://epsteinproject.org \
            --max-requests "$MAX_REQUESTS" \
            --expected-app frontend/app.js \
            --expected-css frontend/static/app.css \
            --report "$RUNNER_TEMP/production-smoke.json"

      - name: Publish smoke summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/production-smoke.json" ]; then
            {
              echo '### Production smoke report'
              echo '```json'
              cat "$RUNNER_TEMP/production-smoke.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
