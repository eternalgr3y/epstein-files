version: '3.8'

services:
  app:
    build: .
    container_name: epstein-files-app
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://epsteinproject.org,https://www.epsteinproject.org}
      - DATABASE_PATH=/app/database/epstein_files.db
    volumes:
      - ./database:/app/database:ro
      - ./frontend:/app/frontend:ro
    networks:
      - epstein-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats', timeout=5).read(1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    # Update the exact release tag and OCI index digest together after review.
    image: nginx:1.31.3-alpine3.24@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: epstein-files-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - epstein-net

  certbot:
    # Update the exact release tag and OCI index digest together after review.
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    container_name: epstein-files-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  epstein-net:
    driver: bridge
