version: '3.8'

services:
  app:
    build: .
    container_name: epstein-files-app
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://epsteinfiles.org,https://www.epsteinfiles.org}
      - DATABASE_PATH=/app/database/epstein_files.db
    volumes:
      - ./database:/app/database:ro
      - ./frontend:/app/frontend:ro
    networks:
      - epstein-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: epstein-files-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - epstein-net

  certbot:
    image: certbot/certbot
    container_name: epstein-files-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  epstein-net:
    driver: bridge
