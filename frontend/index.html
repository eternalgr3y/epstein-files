    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0908;
            --bg-elevated: #12110f;
            --border: rgba(201, 165, 92, 0.12);
            --border-hover: rgba(201, 165, 92, 0.25);
            --text: #ebe7e0;
            --text-muted: #8a857d;
            --text-dim: #5c5850;
            --accent: #c9a55c;
            --accent-hover: #d4b06a;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Background */
        .bg-gradient, .bg-grid {
            display: none;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.5rem 3rem;
            background: transparent;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            padding: 0;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent);
        }

        nav a.active {
            color: var(--text);
        }

        /* Mobile hamburger menu */
        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            z-index: 101;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text);
            margin: 5px 0;
            transition: all 0.3s;
        }

        .hamburger.open span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.open span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 320px;
                height: 100vh;
                background: var(--bg);
                flex-direction: column;
                padding: 6rem 2.5rem 2rem;
                gap: 0;
                transition: right 0.4s ease;
                border-left: 1px solid var(--border);
            }

            nav.open {
                right: 0;
            }

            nav a {
                padding: 1.25rem 0;
                font-size: 0.8rem;
                border-bottom: 1px solid var(--border);
            }

            .nav-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.7);
                z-index: 99;
            }

            .nav-overlay.open {
                display: block;
            }

            header {
                padding: 1.25rem 1.5rem;
            }
        }

        /* Main content */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 8rem 0 4rem;
        }

        .hero-badge {
            display: block;
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-bottom: 3rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .hero-badge .dot {
            display: none;
        }

        .hero h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.05;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .hero p {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 420px;
            margin: 0 auto 4rem;
            line-height: 1.8;
        }

        /* Search */
        .search-container {
            max-width: 480px;
            margin: 0 auto;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            background: transparent;
            border: 1px solid var(--border);
            padding: 0;
            transition: border-color 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent);
        }

        .search-box input {
            flex: 1;
            padding: 1.25rem 1.5rem;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 0.95rem;
            letter-spacing: 0.01em;
        }

        .search-box input::placeholder {
            color: var(--text-dim);
        }

        .search-btn {
            padding: 1.25rem 1.75rem;
            background: transparent;
            border: none;
            border-left: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            color: var(--accent);
            background: rgba(201, 165, 92, 0.05);
        }

        /* Browse links */
        .browse-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-top: 5rem;
        }

        .browse-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            transition: color 0.3s ease;
        }

        .browse-links a:hover {
            color: var(--accent);
        }

        .browse-links .sep {
            color: var(--text-dim);
            font-size: 0.6rem;
        }

        /* Results area */
        .results-container {
            display: none;
        }

        .results-container.active {
            display: block;
            padding-top: 10rem;
            min-height: 100vh;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .results-header h2 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
        }

        .results-count {
            color: var(--text-dim);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.3s ease;
            margin-bottom: 3rem;
        }

        .back-btn:hover {
            color: var(--accent);
        }

        /* Result cards */
        .result-card {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 2rem 0;
            margin-bottom: 0;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            padding-left: 1rem;
            border-color: var(--accent);
        }

        .result-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 0.75rem;
        }

        .result-title a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .result-title a:hover {
            color: var(--accent);
        }

        .result-meta {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .result-snippet {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .result-snippet mark {
            background: rgba(201, 165, 92, 0.2);
            color: var(--text);
            padding: 0.1em 0.3em;
        }

        /* Video grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .video-card {
            background: transparent;
            border: none;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .video-card:hover img {
            border-color: var(--accent);
        }

        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            transition: border-color 0.3s ease;
        }

        .video-card .info {
            padding: 1rem 0;
        }

        .video-card .info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Tape list */
        .tape-section {
            margin-bottom: 4rem;
        }

        .tape-section h3 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .tape-card {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 1.5rem 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tape-card:hover {
            padding-left: 1rem;
            border-color: var(--accent);
        }

        .tape-icon {
            display: none;
        }

        .tape-icon svg {
            display: none;
        }

        .tape-info {
            flex: 1;
        }

        .tape-info h4 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 0.35rem;
            color: var(--text);
        }

        .tape-info span {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .tape-badge {
            padding: 0.3rem 0.75rem;
            background: transparent;
            border: 1px solid var(--border);
            font-size: 0.6rem;
            font-weight: 400;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Document viewer */
        .doc-viewer {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.75rem;
            background: transparent;
            border-bottom: 1px solid var(--border);
        }

        .doc-header span {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
        }

        .doc-content {
            padding: 2rem;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            line-height: 1.9;
            white-space: pre-wrap;
            max-height: 70vh;
            overflow-y: auto;
        }

        .media-player {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .media-player video,
        .media-player audio {
            width: 100%;
            border-radius: 12px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: transparent;
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn:focus-visible, a:focus-visible, button:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .pagination span {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }

        /* Image grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .image-card {
            position: relative;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1;
        }

        .image-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-card:hover img {
            transform: scale(1.02);
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(transparent, rgba(10, 9, 8, 0.9));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-card:hover .image-overlay {
            opacity: 1;
        }

        .image-overlay span {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Image modal */
        .image-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(10, 9, 8, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }

        .image-modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-modal-content img {
            max-width: 100%;
            max-height: calc(90vh - 100px);
            object-fit: contain;
            border: 1px solid var(--border);
        }

        .image-modal-close {
            position: absolute;
            top: -50px;
            right: 0;
            width: 40px;
            height: 40px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .image-modal-close:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .image-modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Entity badges */
        .entity-card {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 2rem 0;
            margin-bottom: 0;
            transition: all 0.3s ease;
        }

        .entity-card:hover {
            padding-left: 1rem;
            border-color: var(--accent);
        }

        .role-badge {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            background: transparent;
            border: 1px solid var(--border);
            font-size: 0.6rem;
            font-weight: 400;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .mention-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .mention-row:first-child {
            border-top: none;
        }

        .mention-row a {
            color: var(--accent);
            text-decoration: none;
        }

        .mention-row a:hover {
            text-decoration: underline;
        }

        /* States */
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-dim);
        }

        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        .error-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .error-state h3 {
            color: var(--red);
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .error-state p {
            margin-bottom: 1.5rem;
        }

        .error-state .btn {
            margin: 0 auto;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .empty {
            text-align: center;
            padding: 4rem;
            color: var(--text-dim);
        }

        /* Footer */
        footer {
            margin-top: 8rem;
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        footer p {
            color: var(--text-dim);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--accent);
        }

        /* Mobile responsive */
        @media (max-width: 900px) {
            .gallery-nav {
                gap: 2.5rem;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 1rem 1.25rem;
            }

            .logo {
                font-size: 0.85rem;
            }

            main {
                padding: 0 1.25rem;
            }

            .hero {
                padding: 6rem 0 3rem;
            }

            .hero h1 {
                font-size: 2.25rem;
            }

            .hero p {
                font-size: 0.95rem;
                margin-bottom: 3rem;
            }

            .search-box {
                flex-direction: column;
                border: 1px solid var(--border);
            }

            .search-box input {
                width: 100%;
                text-align: center;
                padding: 1.25rem;
            }

            .search-btn {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
            }

            .gallery-nav {
                gap: 2rem;
            }

            .gallery-nav-count {
                font-size: 1.5rem;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .video-card .info {
                padding: 0.75rem 0;
            }

            .tape-card {
                padding: 1.25rem 0;
            }

            .doc-viewer {
                margin: 0 -1.25rem;
            }

            .image-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .results-container.active {
                padding-top: 7rem;
            }
        }

        /* Screen reader */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <div class="nav-overlay" id="nav-overlay" onclick="toggleMobileNav()"></div>
    <header>
        <div class="header-inner">
            <a href="#" onclick="goHome(); return false;" class="logo">Epstein<span>Files</span></a>
            <nav id="main-nav">
                <a href="#" onclick="showImages(); closeMobileNav(); return false;" id="nav-images">Images</a>
                <a href="#" onclick="showVideos(); closeMobileNav(); return false;" id="nav-videos">Videos</a>
                <a href="#" onclick="showMaxwellTapes(); closeMobileNav(); return false;" id="nav-maxwell">Maxwell Tapes</a>
                <a href="#" onclick="showDocuments(); closeMobileNav(); return false;" id="nav-docs">Documents</a>
                <a href="#" onclick="showAbout(); closeMobileNav(); return false;" id="nav-about">About</a>
            </nav>
            <button class="hamburger" id="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>
        <!-- Home -->
        <div id="home-view">
            <section class="hero">
                <div class="hero-badge">Department of Justice Release</div>
                <h1>Epstein Files</h1>
                <p>A searchable archive of documents, videos, and recordings from the official DOJ release.</p>
            </section>

            <div class="search-container">
                <div class="search-box">
                    <input type="search" id="q" placeholder="Search documents, names, locations..." autofocus>
                    <button class="search-btn" onclick="doSearch()">Search</button>
                </div>
            </div>

            <nav class="browse-links">
                <a href="#" onclick="showDocuments(); return false;">Documents</a>
                <span class="sep">·</span>
                <a href="#" onclick="showImages(); return false;">Images</a>
                <span class="sep">·</span>
                <a href="#" onclick="showVideos(); return false;">Videos</a>
                <span class="sep">·</span>
                <a href="#" onclick="showMaxwellTapes(); return false;">Recordings</a>
            </nav>

            <!-- Ad Unit - Homepage Bottom (uncomment when AdSense approved) -->
            <!-- <div class="ad-unit" style="margin-top: 2rem; text-align: center; padding: 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;">
                <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                    data-ad-slot="XXXXXXXXXX"
                    data-ad-format="auto"
                    data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div> -->
        </div>

        <!-- Results container -->
        <div id="results-view" class="results-container"></div>
    </main>

    <footer>
        <p>
            <a href="https://rainn.org" target="_blank">RAINN</a> 1-800-656-4673 &nbsp;·&nbsp;
            <a href="https://justice.gov/epstein" target="_blank">DOJ Source</a>
        </p>
    </footer>

    <div id="sr-announce" class="sr-only" aria-live="assertive"></div>

    <script>
    const API = 'https://epstein-files-api.protonuser597.workers.dev/api';

    // Navigation state
    let currentView = 'home';
    let currentHash = '';  // Track current hash to prevent redundant fetches
    let isLoading = false; // Prevent double-fetches

    // Elements
    const homeView = document.getElementById('home-view');
    const resultsView = document.getElementById('results-view');
    const searchInput = document.getElementById('q');
    const mainNav = document.getElementById('main-nav');
    const hamburger = document.getElementById('hamburger');
    const navOverlay = document.getElementById('nav-overlay');

    // Mobile nav functions
    function toggleMobileNav() {
        mainNav.classList.toggle('open');
        hamburger.classList.toggle('open');
        navOverlay.classList.toggle('open');
        document.body.style.overflow = mainNav.classList.contains('open') ? 'hidden' : '';
    }

    function closeMobileNav() {
        mainNav.classList.remove('open');
        hamburger.classList.remove('open');
        navOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    // Escape key closes mobile menu
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && mainNav.classList.contains('open')) {
            closeMobileNav();
        }
    });

    // Scroll position restoration
    const scrollPositions = new Map();

    function saveScrollPosition() {
        if (currentHash) {
            scrollPositions.set(currentHash, window.scrollY);
        }
    }

    function restoreScrollPosition(hash) {
        const pos = scrollPositions.get(hash);
        if (pos !== undefined) {
            requestAnimationFrame(() => window.scrollTo(0, pos));
        } else {
            window.scrollTo(0, 0);
        }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        loadStats();
        currentHash = location.hash.slice(1) || 'home';
        handleHash();

        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });
    });

    window.addEventListener('popstate', () => {
        const newHash = location.hash.slice(1) || 'home';
        // Only handle if hash actually changed
        if (newHash !== currentHash) {
            saveScrollPosition(); // Save before navigating away
            currentHash = newHash;
            handleHash();
            restoreScrollPosition(newHash); // Restore after loading
        }
    });

    function loadStats() {
        // Stats removed from homepage
    }

    function handleHash() {
        const hash = location.hash.slice(1);
        if (!hash || hash === 'home') { goHome(true); return; }

        const [type, ...rest] = hash.split('/');
        const param = rest.join('/');

        if (type === 'search' && param) {
            searchInput.value = decodeURIComponent(param);
            doSearch(true); // true = don't pushState, we're already at this hash
        } else if (type === 'images') {
            showImages(0, true);
        } else if (type === 'videos') {
            showVideos(0, true);
        } else if (type === 'maxwell') {
            showMaxwellTapes(true);
        } else if (type === 'documents') {
            showDocuments(0, true);
        } else if (type === 'doc' && param) {
            viewDoc(parseInt(param), true);
        } else if (type === 'entity' && param) {
            viewEntity(parseInt(param), 0, true);
        } else if (type === 'about') {
            showAbout(true);
        }
    }

    function setView(view) {
        currentView = view;
        homeView.style.display = view === 'home' ? 'block' : 'none';
        resultsView.style.display = view === 'home' ? 'none' : 'block';
        resultsView.classList.toggle('active', view !== 'home');

        // Update nav active state
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        if (view === 'images') document.getElementById('nav-images').classList.add('active');
        else if (view === 'videos') document.getElementById('nav-videos').classList.add('active');
        else if (view === 'maxwell') document.getElementById('nav-maxwell').classList.add('active');
        else if (view === 'documents') document.getElementById('nav-docs').classList.add('active');
        else if (view === 'about') document.getElementById('nav-about').classList.add('active');
    }

    function goHome(skipPush = false) {
        saveScrollPosition();
        setView('home');
        searchInput.value = '';
        currentHash = 'home';
        if (!skipPush && location.hash) {
            history.pushState(null, '', location.pathname);
        }
        window.scrollTo(0, 0);
    }

    function doSearch(skipPush = false) {
        const q = searchInput.value.trim();
        if (!q) return;
        if (isLoading) return; // Prevent double-fetch
        saveScrollPosition();

        setView('search');
        resultsView.innerHTML = '<div class="loading">Searching</div>';
        isLoading = true;

        const newHash = `search/${encodeURIComponent(q)}`;
        currentHash = newHash;
        if (!skipPush) {
            history.pushState(null, '', `#${newHash}`);
        }

        Promise.all([
            fetch(`${API}/search?q=${encodeURIComponent(q)}&limit=50`).then(r => r.json()),
            fetch(`${API}/entities/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: q, limit: 5 })
            }).then(r => r.json())
        ]).then(([docs, ents]) => {
            renderSearchResults(q, docs, ents);
        }).catch(() => {
            resultsView.innerHTML = `
                <div class="error-state">
                    <h3>Search failed</h3>
                    <p>Unable to reach the server. Check your connection and try again.</p>
                    <button class="btn" onclick="doSearch()">Retry</button>
                </div>
            `;
        }).finally(() => {
            isLoading = false;
        });
    }

    function renderSearchResults(query, docs, ents) {
        let html = `<button class="back-btn" onclick="goHome()">← Back</button>`;

        if (ents.results?.length) {
            html += `
                <div class="results-header">
                    <h2>People & Organizations</h2>
                    <span class="results-count">${ents.total_results} found</span>
                </div>
            `;
            ents.results.forEach(e => {
                html += `
                    <div class="entity-card" style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div class="result-title">${esc(e.canonical_name)}</div>
                            <div class="result-meta">${e.entity_type} · ${e.mention_count.toLocaleString()} mentions across documents</div>
                        </div>
                        <button class="btn" onclick="viewEntity(${e.entity_id})">View all mentions →</button>
                    </div>
                `;
            });
        }

        if (docs.results?.length) {
            html += `
                <div class="results-header" style="margin-top: 2rem;">
                    <h2>Documents</h2>
                    <span class="results-count">${docs.total_results} found</span>
                </div>
            `;
            docs.results.forEach(d => {
                html += `
                    <div class="result-card">
                        <div class="result-title"><a href="#" onclick="viewDoc(${d.document_id}); return false;">${esc(d.title || d.filename)}</a></div>
                        <div class="result-meta">${d.data_set || ''}</div>
                        ${d.snippet ? `<div class="result-snippet">${highlight(esc(d.snippet))}</div>` : ''}
                    </div>
                `;
            });
        }

        if (!ents.results?.length && !docs.results?.length) {
            html += '<div class="empty">No results found.</div>';
        }

        resultsView.innerHTML = html;
    }

    // === VIDEOS ===
    async function showVideos(offset = 0, skipPush = false) {
        setView('videos');
        resultsView.innerHTML = '<div class="loading">Loading videos</div>';
        currentHash = 'videos';
        if (!skipPush && location.hash !== '#videos') history.pushState(null, '', '#videos');

        try {
            const r = await fetch(`${API}/videos?limit=48&offset=${offset}`).then(r => r.json());

            let html = `
                <button class="back-btn" onclick="goHome()">← Back</button>
                <div class="results-header">
                    <h2>Video Evidence</h2>
                    <span class="results-count">${r.total.toLocaleString()} videos</span>
                </div>
                <div class="video-grid">
                    ${r.videos.map(v => `
                        <div class="video-card" onclick="viewDoc(${v.id})">
                            <img src="${API}/videos/${v.id}/thumb" loading="lazy" alt="${esc(v.title)}"
                                 onerror="this.style.background='var(--gradient-1)'">
                            <div class="info"><p>${esc(v.filename)}</p></div>
                        </div>
                    `).join('')}
                </div>
                <div class="pagination">
                    ${offset > 0 ? `<button class="btn" onclick="showVideos(${offset - 48})">← Previous</button>` : ''}
                    ${r.videos.length === 48 ? `<button class="btn" onclick="showVideos(${offset + 48})">Next →</button>` : ''}
                </div>
            `;
            resultsView.innerHTML = html;
        } catch (e) {
            resultsView.innerHTML = `
                <div class="error-state">
                    <h3>Failed to load videos</h3>
                    <p>Check your connection and try again.</p>
                    <button class="btn" onclick="showVideos(${offset})">Retry</button>
                </div>
            `;
        }
    }

    // === MAXWELL TAPES ===
    async function showMaxwellTapes(skipPush = false) {
        setView('maxwell');
        resultsView.innerHTML = '<div class="loading">Loading</div>';
        currentHash = 'maxwell';
        if (!skipPush && location.hash !== '#maxwell') history.pushState(null, '', '#maxwell');

        try {
            const r = await fetch(`${API}/maxwell-tapes`).then(r => r.json());
            const day1 = r.tapes.filter(t => t.day === 'Day 1');
            const day2 = r.tapes.filter(t => t.day === 'Day 2');

            const micIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`;

            const renderTapes = (tapes, dayLabel) => tapes.map(t => `
                <div class="tape-card" onclick="viewDoc(${t.id})">
                    <div class="tape-icon">${micIcon}</div>
                    <div class="tape-info">
                        <h4>Part ${t.part || '?'}</h4>
                        <span>${esc(t.filename)}</span>
                    </div>
                    <span class="tape-badge">${dayLabel}</span>
                </div>
            `).join('');

            let html = `
                <button class="back-btn" onclick="goHome()">← Back</button>
                <div class="results-header">
                    <h2>Maxwell Deposition Tapes</h2>
                    <span class="results-count">${r.total} recordings</span>
                </div>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">
                    Audio recordings from Ghislaine Maxwell's deposition.
                </p>

                <div class="tape-section">
                    <h3>Day 1</h3>
                    ${renderTapes(day1, 'Day 1')}
                </div>

                <div class="tape-section">
                    <h3>Day 2</h3>
                    ${renderTapes(day2, 'Day 2')}
                </div>
            `;
            resultsView.innerHTML = html;
        } catch (e) {
            resultsView.innerHTML = `
                <div class="error-state">
                    <h3>Failed to load Maxwell tapes</h3>
                    <p>Check your connection and try again.</p>
                    <button class="btn" onclick="showMaxwellTapes()">Retry</button>
                </div>
            `;
        }
    }

    // === DOCUMENTS ===
    async function showDocuments(offset = 0, skipPush = false) {
        setView('documents');
        resultsView.innerHTML = '<div class="loading">Loading</div>';
        currentHash = 'documents';
        if (!skipPush && location.hash !== '#documents') history.pushState(null, '', '#documents');

        try {
            const r = await fetch(`${API}/browse?limit=50&offset=${offset}&document_type=pdf`).then(r => r.json());

            let html = `
                <button class="back-btn" onclick="goHome()">← Back</button>
                <div class="results-header">
                    <h2>All Documents</h2>
                    <span class="results-count">${r.total.toLocaleString()} files</span>
                </div>
            `;

            r.results.forEach(d => {
                html += `
                    <div class="result-card" onclick="viewDoc(${d.document_id})" style="cursor:pointer;">
                        <div class="result-title">${esc(d.title || d.filename)}</div>
                        <div class="result-meta">${d.data_set || ''}</div>
                    </div>
                `;
            });

            html += `
                <div class="pagination">
                    ${offset > 0 ? `<button class="btn" onclick="showDocuments(${offset - 50})">← Previous</button>` : ''}
                    ${r.results.length === 50 ? `<button class="btn" onclick="showDocuments(${offset + 50})">Next →</button>` : ''}
                </div>
            `;

            resultsView.innerHTML = html;
        } catch (e) {
            resultsView.innerHTML = `
                <div class="error-state">
                    <h3>Failed to load documents</h3>
                    <p>Check your connection and try again.</p>
                    <button class="btn" onclick="showDocuments(${offset})">Retry</button>
                </div>
            `;
        }
    }

    // === IMAGES ===
    async function showImages(offset = 0, skipPush = false) {
        setView('images');
        resultsView.innerHTML = '<div class="loading">Loading images</div>';
        currentHash = 'images';
        if (!skipPush && location.hash !== '#images') history.pushState(null, '', '#images');

        try {
            const r = await fetch(`${API}/images?limit=60&offset=${offset}`).then(r => r.json());

            if (r.status === 'extraction in progress') {
                resultsView.innerHTML = `
                    <button class="back-btn" onclick="goHome()">← Back</button>
                    <div class="empty">Image extraction in progress. Check back soon!</div>
                `;
                return;
            }

            let html = `
                <button class="back-btn" onclick="goHome()">← Back</button>
                <div class="results-header">
                    <h2>Images</h2>
                    <span class="results-count">${r.total.toLocaleString()} images extracted from PDFs</span>
                </div>
                <div class="image-grid">
                    ${r.images.map(img => `
                        <div class="image-card" onclick="viewImage('${esc(img.filename)}', ${img.doc_id})">
                            <img src="${API}/images/${img.filename}" loading="lazy" alt="Page ${img.page + 1}">
                            <div class="image-overlay">
                                <span>Doc #${img.doc_id} · Page ${img.page + 1}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="pagination">
                    ${offset > 0 ? `<button class="btn" onclick="showImages(${offset - 60})">← Previous</button>` : ''}
                    <span style="color: var(--text-dim); padding: 0.5rem 1rem;">${Math.floor(offset / 60) + 1} / ${Math.ceil(r.total / 60)}</span>
                    ${r.images.length === 60 ? `<button class="btn" onclick="showImages(${offset + 60})">Next →</button>` : ''}
                </div>
            `;
            resultsView.innerHTML = html;
        } catch (e) {
            resultsView.innerHTML = `
                <div class="error-state">
                    <h3>Failed to load images</h3>
                    <p>Check your connection and try again.</p>
                    <button class="btn" onclick="showImages(${offset})">Retry</button>
                </div>
            `;
        }
    }

    function viewImage(filename, docId) {
        const modal = document.createElement('div');
        modal.className = 'image-modal';
        modal.innerHTML = `
            <div class="image-modal-content">
                <button class="image-modal-close" onclick="this.parentElement.parentElement.remove()">×</button>
                <img src="${API}/images/${filename}" alt="Full size">
                <div class="image-modal-actions">
                    <button class="btn" onclick="viewDoc(${docId}); this.closest('.image-modal').remove();">View Source Document</button>
                    <a href="${API}/images/${filename}" download class="btn">Download Image</a>
                </div>
            </div>
        `;
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        document.body.appendChild(modal);
    }

    // === DOCUMENT VIEWER ===
    async function viewDoc(id, skipPush = false) {
        const newHash = `doc/${id}`;
        // Prevent re-fetching if we're already on this doc
        if (currentHash === newHash && !skipPush) return;

        saveScrollPosition();
        setView('doc');
        resultsView.innerHTML = '<div class="loading">Loading</div>';
        currentHash = newHash;
        if (!skipPush) history.pushState(null, '', `#${newHash}`);

        try {
            const doc = await fetch(`${API}/documents/${id}`).then(r => r.json());

            // Audio
            if (doc.content_type?.startsWith('audio/') || doc.filename?.match(/\.(wav|mp3|m4a)$/i)) {
                resultsView.innerHTML = `
                    <button class="back-btn" onclick="goBack()">← Back</button>
                    <div class="doc-viewer">
                        <div class="doc-header">
                            <span style="font-weight: 600;">${esc(doc.title || doc.filename)}</span>
                            <a href="${API}/documents/${id}/file" download class="btn">Download</a>
                        </div>
                        <div class="media-player">
                            <audio controls autoplay>
                                <source src="${API}/documents/${id}/file" type="${doc.content_type || 'audio/wav'}">
                            </audio>
                        </div>
                    </div>
                `;
                return;
            }

            // Video
            if (doc.content_type?.startsWith('video/') || doc.filename?.match(/\.(mp4|mov|avi)$/i)) {
                resultsView.innerHTML = `
                    <button class="back-btn" onclick="goBack()">← Back</button>
                    <div class="doc-viewer">
                        <div class="doc-header">
                            <span style="font-weight: 600;">${esc(doc.filename)}</span>
                            <a href="${API}/documents/${id}/file" download class="btn">Download</a>
                        </div>
                        <div class="media-player">
                            <video controls>
                                <source src="${API}/documents/${id}/file" type="${doc.content_type || 'video/mp4'}">
                            </video>
                        </div>
                    </div>
                `;
                return;
            }

            // PDF/Text
            const text = await fetch(`${API}/documents/${id}/text`).then(r => r.json()).catch(() => null);
            const totalPages = text?.total_pages || 1;
            currentPage = 0;

            const pdfUrl = `${API}/documents/${id}/file`;
            resultsView.innerHTML = `
                <button class="back-btn" onclick="goBack()">← Back</button>
                <div class="doc-viewer">
                    <div class="doc-header">
                        <span style="font-weight: 600;">${esc(doc.title || doc.filename)}</span>
                        <div style="display:flex;gap:0.5rem;">
                            <button class="btn" onclick="togglePdfText()">Toggle Text</button>
                            <a href="${pdfUrl}" target="_blank" class="btn">New Tab</a>
                            <a href="${pdfUrl}" download class="btn">Download</a>
                        </div>
                    </div>
                    <div id="pdf-view" style="height:80vh;">
                        <iframe src="${pdfUrl}" style="width:100%;height:100%;border:none;border-radius:8px;background:#333;" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
                    </div>
                    <div id="text-view" class="doc-content" style="display:none;">${esc(text?.full_text || 'No text available.')}</div>
                </div>
            `;
        } catch (e) {
            resultsView.innerHTML = `
                <div class="error-state">
                    <h3>Failed to load document</h3>
                    <p>Check your connection and try again.</p>
                    <button class="btn" onclick="viewDoc(${id})">Retry</button>
                </div>
            `;
        }
    }

    function goBack() {
        if (window.history.length > 1) {
            history.back();
        } else {
            goHome();
        }
    }

    function togglePdfText() {
        const pdf = document.getElementById('pdf-view');
        const txt = document.getElementById('text-view');
        if (pdf.style.display === 'none') {
            pdf.style.display = 'block';
            txt.style.display = 'none';
        } else {
            pdf.style.display = 'none';
            txt.style.display = 'block';
        }
    }

    // === ENTITY ===
    async function viewEntity(id, offset = 0, skipPush = false) {
        const newHash = `entity/${id}`;
        saveScrollPosition();
        setView('entity');
        resultsView.innerHTML = '<div class="loading">Loading</div>';
        currentHash = newHash;
        if (!skipPush) history.pushState(null, '', `#${newHash}`);

        try {
            const [entity, mentions] = await Promise.all([
                fetch(`${API}/entities/${id}`).then(r => r.json()),
                fetch(`${API}/entities/${id}/mentions?limit=50&offset=${offset}`).then(r => r.json())
            ]);

            let html = `
                <button class="back-btn" onclick="goBack()">← Back</button>
                <div class="results-header">
                    <h2>${esc(entity.canonical_name)}</h2>
                    <span class="results-count">${entity.mention_count || mentions.total_mentions} total mentions</span>
                </div>
            `;

            mentions.mentions.forEach(m => {
                let snippet = m.context_snippet ? esc(m.context_snippet) : null;
                const page = m.page_number ? `Page ${m.page_number}` : '';

                // Highlight the name as it appears in the snippet
                if (snippet && m.name_as_appears) {
                    const nameEsc = esc(m.name_as_appears);
                    const regex = new RegExp(`(${nameEsc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    snippet = snippet.replace(regex, '<mark>$1</mark>');
                }

                html += `
                    <div class="result-card" style="margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                            <div class="result-title">
                                <a href="#" onclick="viewDoc(${m.document_id}); return false;">${esc(m.document_filename)}</a>
                            </div>
                            <span class="role-badge">${m.role || 'mentioned'}</span>
                        </div>
                        ${snippet ? `<div class="result-snippet" style="margin: 0.75rem 0;">"${snippet}"</div>` : ''}
                        <div class="result-meta">${[page, m.data_set].filter(Boolean).join(' · ')}</div>
                    </div>
                `;
            });

            if (!mentions.mentions.length) {
                html += '<div class="empty">No mentions found.</div>';
            }

            // Pagination
            const totalMentions = entity.mention_count || 0;
            if (totalMentions > 50 || offset > 0) {
                html += `
                    <div class="pagination">
                        ${offset > 0 ? `<button class="btn" onclick="viewEntity(${id}, ${offset - 50})">← Previous</button>` : ''}
                        <span style="color: var(--text-dim); padding: 0.5rem 1rem;">
                            ${offset + 1}-${Math.min(offset + mentions.mentions.length, totalMentions)} of ${totalMentions}
                        </span>
                        ${mentions.mentions.length === 50 ? `<button class="btn" onclick="viewEntity(${id}, ${offset + 50})">Next →</button>` : ''}
                    </div>
                `;
            }

            resultsView.innerHTML = html;
        } catch (e) {
            resultsView.innerHTML = `
                <div class="error-state">
                    <h3>Failed to load entity</h3>
                    <p>Check your connection and try again.</p>
                    <button class="btn" onclick="viewEntity(${id}, ${offset})">Retry</button>
                </div>
            `;
        }
    }

    // Utilities
    function esc(s) {
        if (!s) return '';
        return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function highlight(s) {
        return s.replace(/&gt;&gt;&gt;(.+?)&lt;&lt;&lt;/g, '<mark>$1</mark>');
    }
