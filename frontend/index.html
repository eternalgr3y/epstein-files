<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epstein Files</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0b; --bg2: #141417; --bg3: #1c1c21;
            --border: #2a2a30; --text: #e4e4e7; --text2: #a1a1aa; --text3: #71717a;
            --accent: #3b82f6; --accent2: #2563eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }

        /* Header */
        header {
            border-bottom: 1px solid var(--border); padding: 1rem 0;
            position: sticky; top: 0; background: var(--bg); z-index: 100;
        }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.1rem; color: var(--text); }
        .logo:hover { text-decoration: none; }
        header nav { display: flex; gap: 1.5rem; font-size: 0.9rem; }
        header nav a { color: var(--text2); }

        /* Hero */
        .hero { text-align: center; padding: 4rem 0 2rem; }
        .hero h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.75rem; }
        .hero p { color: var(--text2); font-size: 1.1rem; }
        .hero.hidden { display: none; }

        /* Search */
        .search-wrap { max-width: 600px; margin: 2rem auto; position: relative; }
        .search-input {
            width: 100%; padding: 1rem 1rem 1rem 3rem; font-size: 1.1rem;
            background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); outline: none; transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text3); }
        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text3); }

        /* Stats */
        .stats { display: flex; justify-content: center; gap: 3rem; padding: 1.5rem 0; color: var(--text3); font-size: 0.9rem; }
        .stats span strong { color: var(--text); font-size: 1.1rem; }
        .stats.hidden { display: none; }

        /* Results */
        .results { padding: 1rem 0 4rem; }
        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);
        }
        .results-header h2 { font-size: 1rem; font-weight: 500; color: var(--text2); }
        .results-count { font-size: 0.85rem; color: var(--text3); }

        /* Result Cards */
        .result {
            padding: 1.25rem; background: var(--bg2); border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 0.75rem; transition: border-color 0.2s;
        }
        .result:hover { border-color: var(--accent); }
        .result-title { font-weight: 600; margin-bottom: 0.5rem; }
        .result-title a { color: var(--text); }
        .result-title a:hover { color: var(--accent); text-decoration: none; }
        .result-meta { font-size: 0.8rem; color: var(--text3); margin-bottom: 0.75rem; }
        .result-meta span { margin-right: 1rem; }
        .result-snippet { font-size: 0.9rem; color: var(--text2); line-height: 1.7; }
        .result-snippet mark { background: rgba(59, 130, 246, 0.3); color: var(--text); padding: 0.1em 0.2em; border-radius: 2px; }
        .result-actions { margin-top: 1rem; display: flex; gap: 0.5rem; }

        /* Buttons */
        .btn {
            display: inline-block; padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: var(--border); color: var(--text); text-decoration: none; }

        /* Document Viewer */
        .doc-viewer { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .doc-header {
            padding: 1rem; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; background: var(--bg3);
        }
        .doc-content {
            padding: 2rem; font-family: 'Georgia', serif; font-size: 1rem; line-height: 1.9;
            white-space: pre-wrap; max-height: 70vh; overflow-y: auto;
        }

        /* Entity */
        .entity-mentions { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .mention-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; font-size: 0.85rem; }
        .mention-row + .mention-row { border-top: 1px solid var(--border); }
        .role-badge { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: var(--bg3); color: var(--text3); text-transform: uppercase; }

        /* States */
        .empty { text-align: center; padding: 3rem; color: var(--text3); }
        .loading { text-align: center; padding: 3rem; color: var(--text3); }
        .loading::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }

        /* Footer */
        footer { border-top: 1px solid var(--border); padding: 2rem 0; text-align: center; font-size: 0.85rem; color: var(--text3); }
        footer a { color: var(--text2); }

        /* Gallery */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .gallery-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color 0.2s; }
        .gallery-item:hover { border-color: var(--accent); }
        .gallery-item img { width: 100%; height: 150px; object-fit: cover; border-bottom: 1px solid var(--border); }
        .gallery-item p { padding: 0.5rem; font-size: 0.75rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gallery-nav { display: flex; justify-content: center; gap: 1rem; margin: 1rem 0; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.75rem; }
            .stats { gap: 1.5rem; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">Epstein Files</a>
            <nav>
                <a href="#" onclick="browseImages(); return false;">Browse</a>
                <a href="https://codeberg.org/rillow/epstein-files" target="_blank">Source</a>
                <a href="/api/docs" target="_blank">API</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="hero" id="hero">
            <h1>DOJ Document Archive</h1>
            <p>Search 14,000+ publicly released documents</p>
        </div>

        <div class="search-wrap">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" class="search-input" id="q" placeholder="Search documents and entities..." autofocus>
        </div>

        <div class="stats" id="stats">
            <span><strong id="s-docs">--</strong> documents</span>
            <span><strong id="s-ents">14K+</strong> entities</span>
            <span><strong id="s-words">6.4M</strong> words</span>
        </div>

        <div class="results" id="results"></div>
    </main>

    <footer>
        <div class="container">
            <p><a href="https://rainn.org" target="_blank">RAINN</a> 1-800-656-4673</p>
        </div>
    </footer>

    <script>
    const API = '/api';
    let lastResults = null;
    let debounce = null;

    document.getElementById('q').addEventListener('input', e => {
        clearTimeout(debounce);
        debounce = setTimeout(() => search(e.target.value), 300);
    });
    document.getElementById('q').addEventListener('keydown', e => {
        if (e.key === 'Enter') { clearTimeout(debounce); search(e.target.value); }
    });

    fetch(`${API}/stats`).then(r => r.json()).then(d => {
        document.getElementById('s-docs').textContent = (d.total || 0).toLocaleString();
    }).catch(() => {});

    async function search(q) {
        q = q.trim();
        if (!q) {
            document.getElementById('hero').classList.remove('hidden');
            document.getElementById('stats').classList.remove('hidden');
            document.getElementById('results').innerHTML = '';
            return;
        }
        document.getElementById('hero').classList.add('hidden');
        document.getElementById('stats').classList.add('hidden');
        document.getElementById('results').innerHTML = '<div class="loading">Searching</div>';

        try {
            const [docs, ents] = await Promise.all([
                fetch(`${API}/search?q=${encodeURIComponent(q)}&limit=20`).then(r => r.json()),
                fetch(`${API}/entities/search`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: q, limit: 5})
                }).then(r => r.json())
            ]);
            lastResults = { docs, ents };
            render(docs, ents);
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty"><p>Search failed.</p></div>';
        }
    }

    function render(docs, ents) {
        let html = '';
        if (ents.results?.length) {
            html += `<div class="results-header"><h2>People & Organizations</h2><span class="results-count">${ents.total_results} found</span></div>`;
            html += ents.results.map(e => `
                <div class="result">
                    <div class="result-title">${esc(e.canonical_name)}</div>
                    <div class="result-meta"><span>${e.entity_type}</span><span>${e.mention_count} mentions</span></div>
                    <div class="entity-mentions">
                        ${(e.mentions || []).slice(0, 3).map(m => `
                            <div class="mention-row">
                                <span class="role-badge">${m.role || '?'}</span>
                                <a href="#" onclick="viewDoc(${m.document_id}); return false;">${esc(m.document_filename)}</a>
                            </div>
                        `).join('')}
                        ${e.mention_count > 3 ? `<div class="mention-row"><a href="#" onclick="viewEntity(${e.entity_id}); return false;" class="btn" style="font-size: 0.75rem;">+ ${e.mention_count - 3} more</a></div>` : ''}
                    </div>
                </div>
            `).join('');
        }
        if (docs.results?.length) {
            html += `<div class="results-header" style="margin-top: 2rem;"><h2>Documents</h2><span class="results-count">${docs.total_results} found</span></div>`;
            html += docs.results.map(d => `
                <div class="result">
                    <div class="result-title"><a href="#" onclick="viewDoc(${d.document_id}); return false;">${esc(d.title || d.filename)}</a></div>
                    <div class="result-meta"><span>${d.data_set || ''}</span></div>
                    ${d.snippet ? `<div class="result-snippet">${highlight(esc(d.snippet))}</div>` : ''}
                    <div class="result-actions">
                        <button class="btn" onclick="viewDoc(${d.document_id})">Read</button>
                        <a href="${API}/documents/${d.document_id}/file" target="_blank" class="btn">PDF</a>
                    </div>
                </div>
            `).join('');
        }
        if (!html) html = '<div class="empty"><p>No results found.</p></div>';
        document.getElementById('results').innerHTML = html;
    }

    async function viewDoc(id) {
        currentPage = 0;
        document.getElementById('results').innerHTML = '<div class="loading">Loading</div>';
        try {
            const doc = await fetch(`${API}/documents/${id}`).then(r => r.json());

            // Audio file
            if (doc.content_type?.startsWith('audio/') || doc.filename?.endsWith('.wav') || doc.filename?.endsWith('.mp3')) {
                document.getElementById('results').innerHTML = `
                    <div class="doc-viewer">
                        <div class="doc-header">
                            <button class="btn" onclick="back()">Back</button>
                            <a href="${API}/documents/${id}/file" download class="btn">Download</a>
                        </div>
                        <div style="padding:2rem;text-align:center;">
                            <h3 style="margin-bottom:1rem;">${esc(doc.title || doc.filename)}</h3>
                            <audio controls style="width:100%;max-width:600px;">
                                <source src="${API}/documents/${id}/file" type="${doc.content_type || 'audio/wav'}">
                            </audio>
                            <p style="margin-top:1rem;color:var(--text3);">${(doc.file_size/1024/1024).toFixed(1)} MB</p>
                        </div>
                    </div>
                `;
                return;
            }

            // Video file
            if (doc.content_type?.startsWith('video/') || doc.filename?.endsWith('.mp4')) {
                document.getElementById('results').innerHTML = `
                    <div class="doc-viewer">
                        <div class="doc-header">
                            <button class="btn" onclick="back()">Back</button>
                            <a href="${API}/documents/${id}/file" download class="btn">Download</a>
                        </div>
                        <div style="padding:1rem;text-align:center;">
                            <video controls style="width:100%;max-width:800px;">
                                <source src="${API}/documents/${id}/file" type="${doc.content_type || 'video/mp4'}">
                            </video>
                        </div>
                    </div>
                `;
                return;
            }

            // PDF/text document
            const d = await fetch(`${API}/documents/${id}/text`).then(r => r.json());
            const totalPages = d.total_pages || 1;
            document.getElementById('results').innerHTML = `
                <div class="doc-viewer">
                    <div class="doc-header">
                        <button class="btn" onclick="back()">Back</button>
                        <div style="display:flex;gap:0.5rem;">
                            <button class="btn" onclick="toggleView(${id})">Toggle Image</button>
                            <a href="${API}/documents/${id}/file" target="_blank" class="btn">PDF</a>
                        </div>
                    </div>
                    <div id="doc-img" style="display:none;padding:1rem;text-align:center;">
                        <div style="margin-bottom:0.5rem;">
                            <button class="btn" onclick="prevPage(${id})">←</button>
                            <span id="page-num">1</span> / ${totalPages}
                            <button class="btn" onclick="nextPage(${id}, ${totalPages})">→</button>
                        </div>
                        <img id="page-img" src="${API}/documents/${id}/pages/0/image?width=700" style="max-width:100%;border:1px solid var(--border);border-radius:4px;">
                    </div>
                    <div id="doc-text" class="doc-content">${esc(d.full_text || 'No text available.')}</div>
                </div>
            `;
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty"><p>Failed to load.</p></div>';
        }
    }

    let currentPage = 0;
    function toggleView(id) {
        const img = document.getElementById('doc-img');
        const txt = document.getElementById('doc-text');
        img.style.display = img.style.display === 'none' ? 'block' : 'none';
        txt.style.display = txt.style.display === 'none' ? 'block' : 'none';
    }
    function prevPage(id) {
        if (currentPage > 0) {
            currentPage--;
            document.getElementById('page-img').src = `${API}/documents/${id}/pages/${currentPage}/image?width=700`;
            document.getElementById('page-num').textContent = currentPage + 1;
        }
    }
    function nextPage(id, total) {
        if (currentPage < total - 1) {
            currentPage++;
            document.getElementById('page-img').src = `${API}/documents/${id}/pages/${currentPage}/image?width=700`;
            document.getElementById('page-num').textContent = currentPage + 1;
        }
    }

    async function viewEntity(id) {
        document.getElementById('results').innerHTML = '<div class="loading">Loading mentions</div>';
        try {
            const [entity, mentions] = await Promise.all([
                fetch(`${API}/entities/${id}`).then(r => r.json()),
                fetch(`${API}/entities/${id}/mentions?limit=100`).then(r => r.json())
            ]);
            document.getElementById('results').innerHTML = `
                <div class="doc-viewer">
                    <div class="doc-header">
                        <button class="btn" onclick="back()">Back</button>
                        <span style="color: var(--text2);">${esc(entity.canonical_name)} - ${mentions.total_mentions} mentions</span>
                    </div>
                    <div style="padding: 1rem;">
                        ${mentions.mentions.map(m => `
                            <div class="mention-row">
                                <span class="role-badge">${m.role || '?'}</span>
                                <a href="#" onclick="viewDoc(${m.document_id}); return false;">${esc(m.document_filename)}</a>
                                <span style="color: var(--text3); font-size: 0.75rem;">${m.data_set || ''}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty"><p>Failed to load mentions.</p></div>';
        }
    }

    function back() { if (lastResults) render(lastResults.docs, lastResults.ents); }

    let galleryOffset = 0;
    async function browseImages(offset = 0) {
        galleryOffset = offset;
        document.getElementById('hero').classList.add('hidden');
        document.getElementById('stats').classList.add('hidden');
        document.getElementById('results').innerHTML = '<div class="loading">Loading documents</div>';

        try {
            const r = await fetch(`${API}/browse?limit=24&offset=${offset}`).then(r => r.json());
            const docs = r.results || [];

            let html = `
                <div class="results-header">
                    <h2>Browse Documents</h2>
                    <span class="results-count">${r.total} total</span>
                </div>
                <div class="gallery">
                    ${docs.map(d => `
                        <div class="gallery-item" onclick="viewDoc(${d.document_id})">
                            <img src="${API}/documents/${d.document_id}/thumbnail?width=300" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23222%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2212%22>No preview</text></svg>'">
                            <p>${esc(d.filename)}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="gallery-nav">
                    ${offset > 0 ? `<button class="btn" onclick="browseImages(${offset - 24})">← Previous</button>` : ''}
                    <button class="btn" onclick="browseImages(${offset + 24})">Next →</button>
                </div>
            `;
            document.getElementById('results').innerHTML = html;
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty">Failed to load.</div>';
        }
    }
    function esc(s) { if (!s) return ''; return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function highlight(s) { return s.replace(/&gt;&gt;&gt;(.+?)&lt;&lt;&lt;/g, '<mark>$1</mark>'); }
    </script>
</body>
</html>
