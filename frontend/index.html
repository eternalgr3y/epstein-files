<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epstein Files</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0b; --bg2: #141417; --bg3: #1c1c21;
            --border: #2a2a30; --text: #e4e4e7; --text2: #a1a1aa; --text3: #71717a;
            --accent: #3b82f6; --accent2: #2563eb;
            --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
            /* Safe area for notched phones */
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Skip link for accessibility */
        .skip-link {
            position: absolute; top: -40px; left: 0; padding: 8px 16px;
            background: var(--accent); color: white; z-index: 1000;
            transition: top 0.2s;
        }
        .skip-link:focus { top: 0; }

        /* Focus styles for keyboard navigation */
        a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
            outline: none; box-shadow: var(--focus-ring);
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }

        /* Header */
        header {
            border-bottom: 1px solid var(--border); padding: 1rem 0;
            position: sticky; top: 0; background: var(--bg); z-index: 100;
        }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.1rem; color: var(--text); }
        .logo:hover { text-decoration: none; }
        header nav { display: flex; gap: 1.5rem; font-size: 0.9rem; }
        header nav a { color: var(--text2); }

        /* Hero */
        .hero { text-align: center; padding: 4rem 0 2rem; }
        .hero h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.75rem; }
        .hero p { color: var(--text2); font-size: 1.1rem; }
        .hero.hidden { display: none; }

        /* Search */
        .search-wrap { max-width: 600px; margin: 2rem auto; position: relative; }
        .search-input {
            width: 100%; padding: 1rem 1rem 1rem 3rem; font-size: 1.1rem;
            background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); outline: none; transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text3); }
        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text3); }

        /* Filters */
        .filters { display: flex; justify-content: center; gap: 0.75rem; margin-top: 1rem; }
        .filters select {
            padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 6px;
            background: var(--bg2); border: 1px solid var(--border); color: var(--text2);
            cursor: pointer; outline: none;
        }
        .filters select:focus { border-color: var(--accent); }
        .filters.hidden { display: none; }

        /* Stats */
        .stats { display: flex; justify-content: center; gap: 3rem; padding: 1.5rem 0; color: var(--text3); font-size: 0.9rem; }
        .stats span strong { color: var(--text); font-size: 1.1rem; }
        .stats.hidden { display: none; }

        /* Results */
        .results { padding: 1rem 0 4rem; }
        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);
        }
        .results-header h2 { font-size: 1rem; font-weight: 500; color: var(--text2); }
        .results-count { font-size: 0.85rem; color: var(--text3); }

        /* Result Cards */
        .result {
            padding: 1.25rem; background: var(--bg2); border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 0.75rem; transition: border-color 0.2s;
        }
        .result:hover { border-color: var(--accent); }
        .result-title { font-weight: 600; margin-bottom: 0.5rem; }
        .result-title a { color: var(--text); }
        .result-title a:hover { color: var(--accent); text-decoration: none; }
        .result-meta { font-size: 0.8rem; color: var(--text3); margin-bottom: 0.75rem; }
        .result-meta span { margin-right: 1rem; }
        .result-snippet { font-size: 0.9rem; color: var(--text2); line-height: 1.7; }
        .result-snippet mark { background: rgba(59, 130, 246, 0.3); color: var(--text); padding: 0.1em 0.2em; border-radius: 2px; }
        .result-actions { margin-top: 1rem; display: flex; gap: 0.5rem; }

        /* Buttons */
        .btn {
            display: inline-block; padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: var(--border); color: var(--text); text-decoration: none; }

        /* Document Viewer */
        .doc-viewer { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .doc-header {
            padding: 1rem; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; background: var(--bg3);
        }
        .doc-content {
            padding: 2rem; font-family: 'Georgia', serif; font-size: 1rem; line-height: 1.9;
            white-space: pre-wrap; max-height: 70vh; overflow-y: auto;
        }

        /* Entity */
        .entity-mentions { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .mention-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; font-size: 0.85rem; }
        .mention-row + .mention-row { border-top: 1px solid var(--border); }
        .role-badge { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: var(--bg3); color: var(--text3); text-transform: uppercase; }

        /* States */
        .empty { text-align: center; padding: 3rem; color: var(--text3); }
        .loading { text-align: center; padding: 3rem; color: var(--text3); }
        .loading::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }

        /* Screen reader only */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0;
            margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0);
            white-space: nowrap; border: 0;
        }

        /* Footer */
        footer { border-top: 1px solid var(--border); padding: 2rem 0; text-align: center; font-size: 0.85rem; color: var(--text3); padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
        footer a { color: var(--text2); }

        /* Media players - responsive */
        .media-player { width: 100%; max-width: 800px; margin: 0 auto; }
        .media-player audio, .media-player video { width: 100%; }

        /* Gallery */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .gallery-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color 0.2s; }
        .gallery-item:hover { border-color: var(--accent); }
        .gallery-item img { width: 100%; height: 150px; object-fit: cover; border-bottom: 1px solid var(--border); }
        .gallery-item p { padding: 0.5rem; font-size: 0.75rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gallery-nav { display: flex; justify-content: center; gap: 1rem; margin: 1rem 0; }

        /* ===== MOBILE RESPONSIVE ===== */

        /* Tablet: 768px and below */
        @media (max-width: 768px) {
            .container { padding: 0 1rem; }
            .hero { padding: 2.5rem 0 1.5rem; }
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            .stats { gap: 2rem; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .doc-content { padding: 1.5rem; font-size: 0.95rem; }
        }

        /* Mobile: 600px and below */
        @media (max-width: 600px) {
            /* Header: stack on very small, otherwise shrink */
            header .container { flex-wrap: wrap; gap: 0.5rem; }
            header nav { gap: 1rem; font-size: 0.85rem; }

            /* Hero: compact */
            .hero { padding: 1.5rem 0 1rem; }
            .hero h1 { font-size: 1.5rem; }
            .hero p { font-size: 0.9rem; }

            /* Search: full width, smaller */
            .search-wrap { margin: 1rem auto; }
            .search-input { padding: 0.875rem 0.875rem 0.875rem 2.75rem; font-size: 1rem; }
            .search-icon { left: 0.875rem; }

            /* Filters: stack vertically */
            .filters { flex-direction: column; gap: 0.5rem; }
            .filters select { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; }

            /* Stats: wrap nicely */
            .stats { gap: 1rem; flex-wrap: wrap; justify-content: center; font-size: 0.85rem; }
            .stats span { white-space: nowrap; }

            /* Results: tighter spacing */
            .results { padding: 0.5rem 0 3rem; }
            .results-header { flex-direction: column; align-items: flex-start; gap: 0.25rem; }

            /* Result cards: mobile-friendly */
            .result { padding: 1rem; margin-bottom: 0.5rem; }
            .result-title { font-size: 0.95rem; }
            .result-meta { font-size: 0.75rem; }
            .result-meta span { display: block; margin-right: 0; margin-bottom: 0.25rem; }
            .result-snippet { font-size: 0.85rem; line-height: 1.6; }
            .result-actions { flex-wrap: wrap; }

            /* Buttons: larger touch targets */
            .btn { padding: 0.625rem 1rem; font-size: 0.9rem; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

            /* Entity mentions */
            .mention-row { flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem 0; }
            .role-badge { font-size: 0.65rem; }

            /* Document viewer */
            .doc-viewer { border-radius: 0; margin: 0 -1rem; border-left: none; border-right: none; }
            .doc-header { padding: 0.75rem; flex-wrap: wrap; gap: 0.5rem; }
            .doc-content { padding: 1rem; font-size: 0.9rem; line-height: 1.7; max-height: 60vh; }

            /* Gallery: 2 columns on mobile */
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
            .gallery-item img { height: 120px; }
            .gallery-item p { font-size: 0.7rem; padding: 0.4rem; }
            .gallery-nav { flex-wrap: wrap; }

            /* Footer */
            footer { padding: 1.5rem 0; }
        }

        /* Small phones: 400px and below */
        @media (max-width: 400px) {
            header nav { font-size: 0.8rem; gap: 0.75rem; }
            .hero h1 { font-size: 1.35rem; }
            .stats span strong { font-size: 1rem; }
            .btn { padding: 0.5rem 0.75rem; font-size: 0.85rem; }
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
        <div class="container">
            <a href="#" onclick="goHome(); return false;" class="logo" aria-label="Epstein Files - Home">Epstein Files</a>
            <nav aria-label="Main navigation">
                <a href="#" onclick="browseImages(); return false;">Browse</a>
                <a href="#" onclick="showAbout(); return false;">About</a>
                <a href="https://codeberg.org/rillow/epstein-files" target="_blank" rel="noopener noreferrer">Source Code</a>
            </nav>
        </div>
    </header>

    <main class="container" id="main-content">
        <div class="hero" id="hero">
            <h1>DOJ Document Archive</h1>
            <p>Search 14,000+ publicly released documents</p>
        </div>

        <div class="search-wrap">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="search" class="search-input" id="q" placeholder="Search documents and entities..." autofocus aria-label="Search documents and entities">
        </div>
        <div class="filters" id="filters">
            <select id="f-type" aria-label="Filter by document type">
                <option value="">All Types</option>
            </select>
            <select id="f-dataset" aria-label="Filter by data set">
                <option value="">All Data Sets</option>
            </select>
        </div>

        <div class="stats" id="stats">
            <span><strong id="s-docs">--</strong> documents</span>
            <span><strong id="s-ents">--</strong> entities</span>
            <span><strong id="s-words">--</strong> words</span>
        </div>

        <div class="results" id="results" role="region" aria-live="polite" aria-label="Search results"></div>
        <div id="sr-announce" class="sr-only" aria-live="assertive"></div>
    </main>

    <footer>
        <div class="container">
            <p><a href="https://rainn.org" target="_blank">RAINN</a> 1-800-656-4673</p>
        </div>
    </footer>

    <script>
    const API = '/api';
    let navStack = [];  // Navigation history stack
    let debounce = null;

    function pushNav(type, data) {
        navStack.push({ type, data, scroll: window.scrollY });
        updateHash(type, data);
    }

    // === Shareable URLs ===
    function updateHash(type, data) {
        let hash = '';
        if (type === 'search' && data.q) hash = `#search/${encodeURIComponent(data.q)}`;
        else if (type === 'doc') hash = `#doc/${data.id}`;
        else if (type === 'entity') hash = `#entity/${data.id}`;
        else if (type === 'browse') hash = '#browse';
        else if (type === 'about') hash = '#about';
        if (hash && location.hash !== hash) history.pushState(null, '', hash);
    }

    function handleHash() {
        const hash = location.hash.slice(1);
        if (!hash) return;
        const [type, ...rest] = hash.split('/');
        const param = rest.join('/');
        if (type === 'search' && param) {
            document.getElementById('q').value = decodeURIComponent(param);
            search(decodeURIComponent(param));
        } else if (type === 'doc' && param) {
            viewDoc(parseInt(param), true);
        } else if (type === 'entity' && param) {
            viewEntity(parseInt(param), true);
        } else if (type === 'browse') {
            browseImages(0, null, true);
        } else if (type === 'about') {
            showAbout();
        }
    }

    window.addEventListener('popstate', handleHash);
    window.addEventListener('DOMContentLoaded', handleHash);

    document.getElementById('q').addEventListener('input', e => {
        clearTimeout(debounce);
        debounce = setTimeout(() => search(e.target.value), 300);
    });
    document.getElementById('q').addEventListener('keydown', e => {
        if (e.key === 'Enter') { clearTimeout(debounce); search(e.target.value); }
    });

    fetch(`${API}/stats`).then(r => r.json()).then(d => {
        document.getElementById('s-docs').textContent = (d.total || 0).toLocaleString();
        document.getElementById('s-ents').textContent = (d.entity_count || 0).toLocaleString();
        // Format word count (e.g., 6.4M)
        const words = d.total_words || 0;
        const wordStr = words >= 1000000 ? (words / 1000000).toFixed(1) + 'M' : words.toLocaleString();
        document.getElementById('s-words').textContent = wordStr;

        // Populate filter dropdowns
        const typeSelect = document.getElementById('f-type');
        const datasetSelect = document.getElementById('f-dataset');

        if (d.document_types) {
            d.document_types.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.type;
                opt.textContent = `${t.type} (${t.count})`;
                typeSelect.appendChild(opt);
            });
        }

        if (d.data_sets) {
            d.data_sets.forEach(ds => {
                const opt = document.createElement('option');
                opt.value = ds.data_set;
                opt.textContent = `${ds.data_set} (${ds.count})`;
                datasetSelect.appendChild(opt);
            });
        }
    }).catch(() => {});

    // Re-search when filters change
    document.getElementById('f-type').addEventListener('change', () => {
        const q = document.getElementById('q').value;
        if (q.trim()) search(q);
    });
    document.getElementById('f-dataset').addEventListener('change', () => {
        const q = document.getElementById('q').value;
        if (q.trim()) search(q);
    });

    async function search(q) {
        q = q.trim();
        if (!q) {
            document.getElementById('hero').classList.remove('hidden');
            document.getElementById('stats').classList.remove('hidden');
            document.getElementById('filters').classList.remove('hidden');
            document.getElementById('results').innerHTML = '';
            return;
        }
        document.getElementById('hero').classList.add('hidden');
        document.getElementById('stats').classList.add('hidden');
        document.getElementById('filters').classList.remove('hidden');
        document.getElementById('results').innerHTML = '<div class="loading">Searching</div>';

        // Get filter values
        const docType = document.getElementById('f-type').value;
        const dataSet = document.getElementById('f-dataset').value;

        // Build search URL with filters
        let searchUrl = `${API}/search?q=${encodeURIComponent(q)}&limit=50`;
        if (docType) searchUrl += `&document_type=${encodeURIComponent(docType)}`;
        if (dataSet) searchUrl += `&data_set=${encodeURIComponent(dataSet)}`;

        try {
            const [docs, ents] = await Promise.all([
                fetch(searchUrl).then(r => r.json()),
                fetch(`${API}/entities/search`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: q, limit: 5})
                }).then(r => r.json())
            ]);
            navStack = [{ type: 'search', data: { docs, ents, q, docType, dataSet }, scroll: 0 }];
            updateHash('search', { q });
            render(docs, ents);
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty"><p>Search failed.</p></div>';
        }
    }

    function render(docs, ents) {
        let html = '';
        if (ents.results?.length) {
            html += `<div class="results-header"><h2>People & Organizations</h2><span class="results-count">${ents.total_results} found</span></div>`;
            html += ents.results.map(e => `
                <div class="result">
                    <div class="result-title">${esc(e.canonical_name)}</div>
                    <div class="result-meta"><span>${e.entity_type}</span><span>${e.mention_count} mentions</span></div>
                    <div class="entity-mentions">
                        ${(e.mentions || []).slice(0, 3).map(m => `
                            <div class="mention-row">
                                <span class="role-badge">${m.role || '?'}</span>
                                <a href="#" onclick="viewDoc(${m.document_id}); return false;">${esc(m.document_filename)}</a>
                            </div>
                        `).join('')}
                        ${e.mention_count > 3 ? `<div class="mention-row"><a href="#" onclick="viewEntity(${e.entity_id}); return false;" class="btn" style="font-size: 0.75rem;">+ ${e.mention_count - 3} more</a></div>` : ''}
                    </div>
                </div>
            `).join('');
        }
        if (docs.results?.length) {
            html += `<div class="results-header" style="margin-top: 2rem;"><h2>Documents</h2><span class="results-count">${docs.total_results} found</span></div>`;
            html += docs.results.map(d => `
                <div class="result">
                    <div class="result-title"><a href="#" onclick="viewDoc(${d.document_id}); return false;">${esc(d.title || d.filename)}</a></div>
                    <div class="result-meta"><span>${d.data_set || ''}</span></div>
                    ${d.snippet ? `<div class="result-snippet">${highlight(esc(d.snippet))}</div>` : ''}
                    <div class="result-actions">
                        <button class="btn" onclick="viewDoc(${d.document_id})">Read</button>
                        <a href="${API}/documents/${d.document_id}/file" target="_blank" class="btn">PDF</a>
                    </div>
                </div>
            `).join('');
        }
        if (!html) html = '<div class="empty"><p>No results found.</p></div>';
        document.getElementById('results').innerHTML = html;

        // Announce to screen readers
        const docCount = docs.results?.length || 0;
        const entCount = ents.results?.length || 0;
        const announce = docCount + entCount > 0
            ? `Found ${docCount} documents and ${entCount} entities`
            : 'No results found';
        document.getElementById('sr-announce').textContent = announce;
    }

    async function viewDoc(id, fromNav = false) {
        // Push current view to nav stack before navigating (unless coming from back())
        if (!fromNav) {
            if (navStack.length > 0) {
                navStack[navStack.length - 1].scroll = window.scrollY;
            }
            pushNav('doc', { id });
        }

        currentPage = 0;  // Always reset page to 0 when viewing a document
        document.getElementById('results').innerHTML = '<div class="loading">Loading</div>';
        try {
            const doc = await fetch(`${API}/documents/${id}`).then(r => r.json());

            // Audio file
            if (doc.content_type?.startsWith('audio/') || doc.filename?.endsWith('.wav') || doc.filename?.endsWith('.mp3')) {
                document.getElementById('results').innerHTML = `
                    <div class="doc-viewer">
                        <div class="doc-header">
                            <button class="btn" onclick="back()">Back</button>
                            <a href="${API}/documents/${id}/file" download class="btn">Download</a>
                        </div>
                        <div class="doc-content" style="text-align:center;font-family:inherit;">
                            <h3 style="margin-bottom:1rem;">${esc(doc.title || doc.filename)}</h3>
                            <div class="media-player">
                                <audio controls>
                                    <source src="${API}/documents/${id}/file" type="${doc.content_type || 'audio/wav'}">
                                </audio>
                            </div>
                            <p style="margin-top:1rem;color:var(--text3);">${(doc.file_size/1024/1024).toFixed(1)} MB</p>
                        </div>
                    </div>
                `;
                return;
            }

            // Video file
            if (doc.content_type?.startsWith('video/') || doc.filename?.endsWith('.mp4')) {
                document.getElementById('results').innerHTML = `
                    <div class="doc-viewer">
                        <div class="doc-header">
                            <button class="btn" onclick="back()">Back</button>
                            <a href="${API}/documents/${id}/file" download class="btn">Download</a>
                        </div>
                        <div class="doc-content" style="text-align:center;font-family:inherit;">
                            <div class="media-player">
                                <video controls>
                                    <source src="${API}/documents/${id}/file" type="${doc.content_type || 'video/mp4'}">
                                </video>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // PDF/text document
            const d = await fetch(`${API}/documents/${id}/text`).then(r => r.json());
            const totalPages = d.total_pages || 1;
            document.getElementById('results').innerHTML = `
                <div class="doc-viewer">
                    <div class="doc-header">
                        <button class="btn" onclick="back()">Back</button>
                        <div style="display:flex;gap:0.5rem;">
                            <button class="btn" onclick="toggleView(${id})">Toggle Image</button>
                            <a href="${API}/documents/${id}/file" target="_blank" class="btn">PDF</a>
                        </div>
                    </div>
                    <div id="doc-img" style="display:none;padding:1rem;text-align:center;">
                        <div style="margin-bottom:0.75rem;display:flex;justify-content:center;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                            <button class="btn" onclick="prevPage(${id})">← Prev</button>
                            <span style="min-width:60px;text-align:center;"><span id="page-num">1</span> / ${totalPages}</span>
                            <button class="btn" onclick="nextPage(${id}, ${totalPages})">Next →</button>
                        </div>
                        <img id="page-img" src="${API}/documents/${id}/pages/0/image?width=900" style="max-width:100%;border:1px solid var(--border);border-radius:4px;">
                    </div>
                    <div id="doc-text" class="doc-content">${esc(d.full_text || 'No text available.')}</div>
                </div>
            `;
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty"><p>Failed to load.</p></div>';
        }
    }

    let currentPage = 0;
    function toggleView(id) {
        const img = document.getElementById('doc-img');
        const txt = document.getElementById('doc-text');
        img.style.display = img.style.display === 'none' ? 'block' : 'none';
        txt.style.display = txt.style.display === 'none' ? 'block' : 'none';
    }
    function prevPage(id) {
        if (currentPage > 0) {
            currentPage--;
            document.getElementById('page-img').src = `${API}/documents/${id}/pages/${currentPage}/image?width=900`;
            document.getElementById('page-num').textContent = currentPage + 1;
        }
    }
    function nextPage(id, total) {
        if (currentPage < total - 1) {
            currentPage++;
            document.getElementById('page-img').src = `${API}/documents/${id}/pages/${currentPage}/image?width=900`;
            document.getElementById('page-num').textContent = currentPage + 1;
        }
    }

    async function viewEntity(id, fromNav = false) {
        // Push current view to nav stack before navigating (unless coming from back())
        if (!fromNav) {
            if (navStack.length > 0) {
                navStack[navStack.length - 1].scroll = window.scrollY;
            }
            pushNav('entity', { id });
        }

        document.getElementById('results').innerHTML = '<div class="loading">Loading mentions</div>';
        try {
            const [entity, mentions] = await Promise.all([
                fetch(`${API}/entities/${id}`).then(r => r.json()),
                fetch(`${API}/entities/${id}/mentions?limit=100`).then(r => r.json())
            ]);
            document.getElementById('results').innerHTML = `
                <div class="doc-viewer">
                    <div class="doc-header">
                        <button class="btn" onclick="back()">Back</button>
                        <span style="color: var(--text2);">${esc(entity.canonical_name)} - ${mentions.total_mentions} mentions</span>
                    </div>
                    <div style="padding: 1rem;">
                        ${mentions.mentions.map(m => `
                            <div class="mention-row">
                                <span class="role-badge">${m.role || '?'}</span>
                                <a href="#" onclick="viewDoc(${m.document_id}); return false;">${esc(m.document_filename)}</a>
                                <span style="color: var(--text3); font-size: 0.75rem;">${m.data_set || ''}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty"><p>Failed to load mentions.</p></div>';
        }
    }

    function back() {
        if (navStack.length <= 1) {
            // Nothing to go back to - show home
            goHome();
            return;
        }

        // Pop current view
        navStack.pop();
        const prev = navStack[navStack.length - 1];

        // Restore previous view (fromNav=true prevents re-pushing to stack)
        if (prev.type === 'search') {
            // Restore filter values
            if (prev.data.docType !== undefined) {
                document.getElementById('f-type').value = prev.data.docType || '';
            }
            if (prev.data.dataSet !== undefined) {
                document.getElementById('f-dataset').value = prev.data.dataSet || '';
            }
            if (prev.data.q) {
                document.getElementById('q').value = prev.data.q;
            }
            render(prev.data.docs, prev.data.ents);
        } else if (prev.type === 'browse') {
            browseImages(prev.data.offset, prev.data.filter, true);
        } else if (prev.type === 'doc') {
            viewDoc(prev.data.id, true);  // fromNav=true
        } else if (prev.type === 'entity') {
            viewEntity(prev.data.id, true);  // fromNav=true
        }

        // Restore scroll position after a brief delay
        if (prev.scroll) {
            setTimeout(() => window.scrollTo(0, prev.scroll), 50);
        }
    }

    function goHome() {
        document.getElementById('hero').classList.remove('hidden');
        document.getElementById('stats').classList.remove('hidden');
        document.getElementById('filters').classList.remove('hidden');
        document.getElementById('results').innerHTML = '';
        document.getElementById('q').value = '';
        document.getElementById('f-type').value = '';
        document.getElementById('f-dataset').value = '';
        navStack = [];
        if (location.hash) history.pushState(null, '', location.pathname);
    }

    let galleryOffset = 0;
    let galleryFilter = null;

    async function browseImages(offset = 0, filter = galleryFilter, fromNav = false) {
        // Only push to nav stack if not coming from back() navigation
        if (!fromNav) {
            if (navStack.length > 0) {
                navStack[navStack.length - 1].scroll = window.scrollY;
            }
            // For browse, we replace the stack entry if already browsing, otherwise push
            if (navStack.length === 0 || navStack[navStack.length - 1].type !== 'browse') {
                pushNav('browse', { offset, filter });
            } else {
                navStack[navStack.length - 1].data = { offset, filter };
            }
        }

        galleryOffset = offset;
        galleryFilter = filter;
        document.getElementById('hero').classList.add('hidden');
        document.getElementById('stats').classList.add('hidden');
        document.getElementById('results').innerHTML = '<div class="loading">Loading</div>';

        try {
            let url = `${API}/browse?limit=24&offset=${offset}`;
            if (filter) url += `&filter=${filter}`;
            const r = await fetch(url).then(r => r.json());
            const docs = r.results || [];

            const filters = [
                {id: null, label: 'All'},
                {id: 'photos', label: 'Photos'},
                {id: 'videos', label: 'Videos'},
                {id: 'audio', label: 'Audio'},
                {id: 'docs', label: 'Documents'}
            ];

            let html = `
                <div class="results-header">
                    <h2>Browse</h2>
                    <span class="results-count">${r.total.toLocaleString()} items</span>
                </div>
                <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
                    ${filters.map(f => `
                        <button class="btn" style="${f.id === filter ? 'background:var(--accent);color:white;' : ''}"
                                onclick="browseImages(0, ${f.id ? `'${f.id}'` : 'null'})">${f.label}</button>
                    `).join('')}
                </div>
                <div class="gallery">
                    ${docs.map(d => `
                        <div class="gallery-item" onclick="viewDoc(${d.document_id})">
                            <img src="${API}/documents/${d.document_id}/thumbnail?width=300" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23222%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2212%22>No preview</text></svg>'">
                            <p>${esc(d.filename)}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="gallery-nav">
                    ${offset > 0 ? `<button class="btn" onclick="browseImages(${offset - 24})">← Previous</button>` : ''}
                    ${docs.length === 24 ? `<button class="btn" onclick="browseImages(${offset + 24})">Next →</button>` : ''}
                </div>
            `;
            document.getElementById('results').innerHTML = html;
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty">Failed to load.</div>';
        }
    }

    function showAbout() {
        document.getElementById('hero').classList.add('hidden');
        document.getElementById('stats').classList.add('hidden');
        document.getElementById('filters').classList.add('hidden');
        if (location.hash !== '#about') history.pushState(null, '', '#about');
        document.getElementById('results').innerHTML = `
            <div class="doc-viewer">
                <div class="doc-header">
                    <button class="btn" onclick="goHome()">Back</button>
                    <span style="color: var(--text2);">About This Project</span>
                </div>
                <div class="doc-content" style="font-family: inherit; line-height: 1.8;">
<h2 style="margin-bottom: 1rem;">What is this?</h2>
<p>A searchable archive of documents released by the U.S. Department of Justice related to the Jeffrey Epstein case. All documents are sourced directly from <a href="https://www.justice.gov/epstein" target="_blank">justice.gov/epstein</a>.</p>

<h2 style="margin: 1.5rem 0 1rem;">What's included?</h2>
<ul style="margin-left: 1.5rem;">
<li><strong>15,000+ documents</strong> from DOJ Data Sets 1-8</li>
<li><strong>419 videos</strong> from surveillance and depositions</li>

<li><strong>Full-text search</strong> across all OCR-processed documents</li>
</ul>

<h2 style="margin: 1.5rem 0 1rem;">What this is NOT</h2>
<ul style="margin-left: 1.5rem;">
<li>Not a news site or investigation</li>

</ul>

<h2 style="margin: 1.5rem 0 1rem;">Technical</h2>
<p>Open source, built with Python/FastAPI and SQLite FTS5. All code at <a href="https://codeberg.org/rillow/epstein-files" target="_blank">codeberg.org/rillow/epstein-files</a>.</p>

<p style="margin-top: 2rem; color: var(--text3); font-size: 0.9rem;">If you or someone you know has been affected by sexual abuse, contact <a href="https://rainn.org" target="_blank">RAINN</a> at 1-800-656-4673.</p>
                </div>
            </div>
        `;
    }

    function esc(s) { if (!s) return ''; return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function highlight(s) { return s.replace(/&gt;&gt;&gt;(.+?)&lt;&lt;&lt;/g, '<mark>$1</mark>'); }
    </script>
</body>
